name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Jellyfin.Plugin.Lumen -c Release -o out
      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="lumen_${VERSION}.zip"
          # Same bytes on every run, so a re-run can never leave the manifest
          # pointing at a checksum the release asset no longer has.
          touch -d @315532800 out/Jellyfin.Plugin.Lumen.dll
          (cd out && zip -X "../$ZIP" Jellyfin.Plugin.Lumen.dll)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.zip }}
      - name: Manifest
        run: |
          mkdir -p site
          cat > site/manifest.json <<JSON
          [
            {
              "guid": "793ea59c-eca9-4462-9496-73ad169b8300",
              "name": "Lumen",
              "description": "Lets the Lumen app find your Seerr automatically after a user signs in.",
              "overview": "Points the Lumen app at your Seerr.",
              "owner": "joost",
              "category": "General",
              "versions": [
                {
                  "version": "${{ steps.package.outputs.version }}.0",
                  "changelog": "See the GitHub release.",
                  "targetAbi": "12.0.0.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip }}",
                  "checksum": "${{ steps.package.outputs.checksum }}",
                  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                },
                {
                  "version": "1.0.0.0",
                  "changelog": "Last release for Jellyfin 10.10 and 10.11.",
                  "targetAbi": "10.10.0.0",
                  "sourceUrl": "https://github.com/${{ github.repository }}/releases/download/v1.0.0/lumen_1.0.0.zip",
                  "checksum": "9308e4de457daff6ea0e67e590d10516",
                  "timestamp": "2026-08-22T11:51:07Z"
                }
              ]
            }
          ]
          JSON
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
